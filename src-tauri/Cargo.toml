[package]
name = "kafkamin"
version = "1.0.0-alpha"
description = "Minimal Kafka/Redpanda desktop client"
edition = "2021"

[lib]
name = "kafkamin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdkafka = { version = "0.37", features = ["cmake-build", "ssl-vendored"] }
# credential-store backend is picked per target below; with none enabled keyring
# still compiles (in-memory store), so an unlisted OS degrades instead of failing
keyring = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Windows Credential Manager — the DPAPI-backed counterpart of the macOS keychain
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
lto = true
codegen-units = 1
